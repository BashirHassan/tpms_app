# DigitalTP Nginx Configuration for demo.sitpms.com (tpms_staging)
# Exact server_name match wins over the existing *.sitpms.com wildcard block
# in /etc/nginx/sites-available/sitpms, so this is safe to add alongside it.
# SSL/TLS: reuses the existing wildcard Cloudflare Origin Certificate.
# Copy to: /etc/nginx/sites-available/demo_sitpms
# Enable: sudo ln -s /etc/nginx/sites-available/demo_sitpms /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.sitpms.com;

    ssl_certificate /etc/ssl/cloudflare/sitpms.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sitpms.com.key;

    root /var/www/tpms_staging/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;

        client_max_body_size 10M;
    }

    location /uploads {
        alias /var/www/tpms_staging/backend/uploads;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
